    <div class="container-logo">
      <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="#0288d1">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>

    </div>

    <nav class="barra-navegacao">
      <ul>

      </ul>
    </nav>
  </header>

  <main class="container-adm">
    <section class="painel-adm">
      <h1>Cadastro de Usuários</h1>

      <form id="form-cadastro-adm" class="formulario-adm">
        <div class="grupo-campo">
          <label for="nome-usuario">Nome do Usuário</label>
          <input type="text" id="nome-usuario" name="nome-usuario" required>
        </div>

        <div class="grupo-campo">
          <label for="email-usuario">E-mail</label>
          <input type="email" id="email-usuario" name="email-usuario" required>
        </div>

        <div class="grupo-botoes">
          <button type="submit" class="botao-adm">Cadastrar</button>
          <button type="button" id="botao-limpar" class="botao-adm botao-secundario">Limpar Campos</button>
        </div>
      </form>

      <div class="controles-lista">
        <div class="grupo-pesquisa">
          <label for="campo-pesquisa">Pesquisar por Nome ou E-mail</label>
          <input type="text" id="campo-pesquisa" placeholder="Digite para filtrar...">
        </div>
        <button type="button" id="botao-excluir-todos" class="botao-adm botao-perigo">Excluir Todos</button>
      </div>

      <ul id="lista-usuarios" class="lista-usuarios"></ul>
    </section>
  </main>

    <div class="conteudo-rodape">
