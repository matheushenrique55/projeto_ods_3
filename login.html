<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidaSaudável - Entrar e Cadastrar</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="container-autenticacao">
    <section class="secao-formulario">
      <h1>Criar Conta</h1>
      <form action="#login" method="get" class="formulario">
        <div class="grupo-campo">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div class="grupo-campo">
          <label for="email-cad">E-mail</label>
          <input type="email" id="email-cad" name="email" required>
        </div>

        <div class="grupo-campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" required>
        </div>

        <div class="grupo-campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" required>
        </div>

        <div class="grupo-campo">
          <label for="senha-cad">Senha</label>
          <input type="password" id="senha-cad" name="senha" required>
        </div>

        <div class="grupo-campo">
          <label for="termos">
            <input type="checkbox" id="termos" name="termos" required> Aceito os termos de uso
          </label>
        </div>

        <button type="submit" class="botao">Cadastrar e Ir para Login</button>
      </form>
    </section>

    <div class="divisor-vertical"></div>

    <section id="login" class="secao-formulario">
      <h2>Acessar Conta</h2>
      <form action="index.html" method="get" class="formulario">
        <div class="grupo-campo">
          <label for="email-login">E-mail</label>
          <input type="email" id="email-login" name="email" required>
        </div>

        <div class="grupo-campo">
          <label for="senha-login">Senha</label>
          <input type="password" id="senha-login" name="senha" required>
        </div>

        <button type="submit" class="botao botao-login">Entrar</button>
      </form>
    </section>
  </main>

</body>
</html>
